[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passaggio-generazionale"
version = "0.1.0"
description = "Passaggio generazionale in Italia: legittima, imposte di successione e donazione, confronto tra testamento, donazioni, nuda proprietà, polizze vita e trust"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Francesco Torraco" }]
keywords = ["successione", "donazioni", "legittima", "passaggio generazionale", "trust", "polizze vita", "Italia"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
    "plotly>=5.20",
    "jinja2>=3.1",
]

[project.optional-dependencies]
png = ["kaleido>=1.0"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
passaggio-generazionale = "passaggio_generazionale.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
passaggio_generazionale = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]
